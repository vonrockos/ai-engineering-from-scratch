[project]
name = "exercises"
version = "0.1.0"
description = "Phase 00 step 05 exercises"
readme = "README.md"
authors = [
    { name = "vonrockos", email = "vonrockos@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
]

[project.scripts]
exercises = "exercises:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
